<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" role="img" aria-label="Timeline of key user:42: set to free at 09:00, pro at 10:30, deleted at 11:15, with a two hour retention window read at 12:00">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9;font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.title{font-size:16px;font-weight:600;fill:#e6edf3}.sub{fill:#8b949e;font-size:12.5px}
.dim{fill:#8b949e}.bad{fill:#ff7b72}.v-free{fill:#e3b341}.v-pro{fill:#7ee787}.small{font-size:11px}
</style>
<defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f85149" fill-opacity=".06"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f85149" stroke-opacity=".22" stroke-width="3"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
</defs>
<rect width="780" height="330" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="28" y="36" class="title">One key, every version, any point in time</text>
<text x="28" y="57" class="sub"><tspan class="mono">user:42</tspan> with Retention: 2h, read at 12:00 after a full compaction. Every answer below came from the engine.</text>
<rect x="60.0" y="76" width="266.1" height="164" fill="url(#hatch)"/>
<text x="68.0" y="92" class="bad small">older than the retention window</text>
<line x1="326.1" y1="76" x2="326.1" y2="222" stroke="#f85149" stroke-dasharray="4 4"/>
<text x="332.1" y="92" class="bad small">cutoff = now − 2h</text>
<rect x="148.7" y="132" width="266.1" height="22" rx="4" fill="#e3b341" fill-opacity=".18" stroke="#e3b341"/>
<text x="281.7" y="147" text-anchor="middle" class="mono v-free">"free"</text>
<text x="148.7" y="124" class="small dim">Put 09:00</text>
<circle cx="148.7" cy="178" r="4.5" fill="#e6edf3"/>
<rect x="414.8" y="132" width="133.0" height="22" rx="4" fill="#7ee787" fill-opacity=".18" stroke="#7ee787"/>
<text x="481.3" y="147" text-anchor="middle" class="mono v-pro">"pro"</text>
<text x="414.8" y="124" class="small dim">Put 10:30</text>
<circle cx="414.8" cy="178" r="4.5" fill="#e6edf3"/>
<rect x="547.8" y="132" width="133.0" height="22" rx="4" fill="none" stroke="#6e7681" stroke-dasharray="4 3"/>
<text x="614.3" y="147" text-anchor="middle" class="dim">deleted</text>
<text x="547.8" y="124" class="small dim">Delete 11:15</text>
<circle cx="547.8" cy="178" r="4.5" fill="#e6edf3"/>
<line x1="60" y1="178" x2="752" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="148.7" y1="174" x2="148.7" y2="182" stroke="#8b949e"/>
