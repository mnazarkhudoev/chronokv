<line x1="326.1" y1="174" x2="326.1" y2="182" stroke="#8b949e"/>
<text x="326.1" y="196" text-anchor="middle" class="small dim">10:00</text>
<line x1="503.5" y1="174" x2="503.5" y2="182" stroke="#8b949e"/>
<text x="503.5" y="196" text-anchor="middle" class="small dim">11:00</text>
<line x1="680.9" y1="174" x2="680.9" y2="182" stroke="#8b949e"/>
<text x="680.9" y="196" text-anchor="middle" class="small dim">12:00</text>
<line x1="680.9" y1="76" x2="680.9" y2="178" stroke="#58a6ff" stroke-dasharray="2 3"/>
<text x="680.9" y="92" text-anchor="middle" class="small" style="fill:#58a6ff">now</text>
<line x1="237.4" y1="236" x2="237.4" y2="188" stroke="#8b949e" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
<text x="237.4" y="252" text-anchor="middle" class="mono small">AsOf(09:30)</text>
<text x="237.4" y="270" text-anchor="middle" class="mono bad">→ ErrHistoryTruncated</text>
<line x1="355.7" y1="236" x2="355.7" y2="188" stroke="#8b949e" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
<text x="355.7" y="252" text-anchor="middle" class="mono small">AsOf(10:10)</text>
<text x="355.7" y="270" text-anchor="middle" class="mono v-free">→ free</text>
<line x1="473.9" y1="236" x2="473.9" y2="188" stroke="#8b949e" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
<text x="473.9" y="252" text-anchor="middle" class="mono small">AsOf(10:50)</text>
<text x="473.9" y="270" text-anchor="middle" class="mono v-pro">→ pro</text>
<line x1="621.7" y1="236" x2="621.7" y2="188" stroke="#8b949e" stroke-dasharray="2 2" marker-end="url(#arrow)"/>
<text x="621.7" y="252" text-anchor="middle" class="mono small">AsOf(11:40)</text>
<text x="621.7" y="270" text-anchor="middle" class="mono dim">→ not found</text>
<text x="28" y="312" class="small dim">The 09:00 version is older than the cutoff but survives compaction: it's still the right answer for reads between 10:00 and 10:30.</text>
</svg>
